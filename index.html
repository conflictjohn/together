<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiona and John</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Parisienne&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff7f8;
    --heart: #d61c3c;
    --heart-dark: #b0132f;
    --ink: #fffaf8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .scene {
    position: relative;
    width: min(92vw, 92vh, 720px);
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
  }
  .heart {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 18px 40px rgba(214, 28, 60, 0.35));
    animation: beat 2.4s ease-in-out infinite;
  }
  .text {
    position: relative;
    text-align: center;
    color: var(--ink);
    text-shadow: 0 2px 10px rgba(120, 0, 20, 0.45);
    padding-bottom: 8%;
  }
  .names {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2.6rem, 10vmin, 5.2rem);
    line-height: 1.1;
    margin: 0;
    font-weight: 400;
  }
  .soon {
    font-family: 'Parisienne', cursive;
    font-size: clamp(3.2rem, 13vmin, 6.8rem);
    line-height: 1.1;
    margin: 0.1em 0 0;
    font-weight: 400;
  }
  .ring {
    position: relative;
    display: block;
    width: clamp(5rem, 20vmin, 10rem);
    margin: 0.2rem auto 0;
  }
  .ring img {
    display: block;
    width: 100%;
    height: auto;
    filter: drop-shadow(0 6px 12px rgba(100, 0, 20, 0.5));
  }
  .spark {
    position: absolute;
    width: 6%;
    aspect-ratio: 1;
    background:
      radial-gradient(circle, #fff 0 18%, transparent 20%),
      linear-gradient(#fff, #fff) center/14% 100% no-repeat,
      linear-gradient(#fff, #fff) center/100% 14% no-repeat;
    opacity: 0;
    animation: twinkle 2.2s ease-in-out infinite;
  }
  .s1 { left: 43%; top: 34%; animation-delay: 0s; }
  .s2 { left: 58%; top: 50%; width: 5%; animation-delay: 0.55s; }
  .s3 { left: 38%; top: 60%; width: 4%; animation-delay: 1.1s; }
  .s4 { left: 52%; top: 68%; width: 5%; animation-delay: 1.65s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.2) rotate(0deg); }
    40%      { opacity: 1; transform: scale(1.1) rotate(45deg); }
    60%      { opacity: 0.9; transform: scale(1) rotate(60deg); }
    80%      { opacity: 0; transform: scale(0.2) rotate(90deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .spark { animation: none; opacity: 0.9; }
  }

  /* ---- wildlife ---- */
  .flock, .skulk {
    position: absolute;
    left: 50%; width: 100vw; margin-left: -50vw;
    pointer-events: none;
  }
  .flock { top: -3%; height: 16%; }
  .skulk { bottom: -3%; height: 18%; }
  .puffin, .fox {
    position: absolute;
    top: 0; height: 100%;
    aspect-ratio: 3 / 2;
  }
  .puffin svg, .fox svg { width: 100%; height: 100%; overflow: visible; }
  .puffin { animation: flyby var(--t, 16s) linear infinite; animation-delay: var(--d, 0s); }
  .fox    { animation: walkby var(--t, 20s) linear infinite; animation-delay: var(--d, 0s); }
  .puffin .bob { animation: bob 1.1s ease-in-out infinite alternate; transform-origin: center; }
  .puffin .wing { transform-origin: 52px 38px; animation: flap 0.45s ease-in-out infinite alternate; }
  .puffin .head { transform-origin: 78px 34px; animation: look-down var(--t, 16s) linear infinite; animation-delay: var(--d, 0s); }
  .fox .head { transform-origin: 44px 48px; animation: look-up var(--t, 20s) linear infinite; animation-delay: var(--d, 0s); }
  .fox .leg  { transform-box: fill-box; transform-origin: 50% 0; animation: step 0.55s ease-in-out infinite alternate; }
  .fox .leg.b { animation-direction: alternate-reverse; }
  .fox .tail { transform-origin: 106px 50px; animation: wag 0.9s ease-in-out infinite alternate; }
  .fox .body { animation: trot 0.55s ease-in-out infinite alternate; }
  @keyframes flyby  { from { left: -25%; } to { left: 102%; } }
  @keyframes walkby { from { left: 102%; } to { left: -25%; } }
  @keyframes bob    { from { transform: translateY(-4%); } to { transform: translateY(4%); } }
  @keyframes flap   { from { transform: rotate(-38deg); } to { transform: rotate(22deg); } }
  @keyframes step   { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
  @keyframes wag    { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
  @keyframes trot   { from { transform: translateY(0); } to { transform: translateY(-2px); } }
  /* heads turn toward the heart while passing its middle, then back */
  @keyframes look-down { 0%, 28% { transform: rotate(0); } 40%, 60% { transform: rotate(30deg); } 72%, 100% { transform: rotate(0); } }
  @keyframes look-up   { 0%, 28% { transform: rotate(0); } 40%, 60% { transform: rotate(24deg); } 72%, 100% { transform: rotate(0); } }
  @media (prefers-reduced-motion: reduce) {
    .flock, .skulk { display: none; }
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    12% { transform: scale(1.035); }
    24% { transform: scale(1); }
    36% { transform: scale(1.025); }
    50% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .heart { animation: none; }
  }
</style>
</head>
