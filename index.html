<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiona and John</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Parisienne&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff7f8;
    --heart: #d61c3c;
    --heart-dark: #b0132f;
    --ink: #fffaf8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .scene {
    position: relative;
    width: min(92vw, 92vh, 720px);
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
  }
  .heart {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 18px 40px rgba(214, 28, 60, 0.35));
    animation: beat 2.4s ease-in-out infinite;
  }
  .text {
    position: relative;
    text-align: center;
    color: var(--ink);
    text-shadow: 0 2px 10px rgba(120, 0, 20, 0.45);
    padding-bottom: 8%;
  }
  .names {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2.6rem, 10vmin, 5.2rem);
    line-height: 1.1;
    margin: 0;
    font-weight: 400;
  }
  .soon {
    font-family: 'Parisienne', cursive;
    font-size: clamp(3.2rem, 13vmin, 6.8rem);
    line-height: 1.1;
    margin: 0.1em 0 0;
    font-weight: 400;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    12% { transform: scale(1.035); }
    24% { transform: scale(1); }
    36% { transform: scale(1.025); }
    50% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .heart { animation: none; }
  }
</style>
</head>
<body>
  <main class="scene">
    <svg class="heart" viewBox="0 0 100 92" aria-hidden="true">
      <defs>
        <radialGradient id="g" cx="35%" cy="30%" r="80%">
          <stop offset="0%" stop-color="#ff4d6d"/>
          <stop offset="55%" stop-color="var(--heart)"/>
          <stop offset="100%" stop-color="var(--heart-dark)"/>
        </radialGradient>
      </defs>
      <path fill="url(#g)" d="M50 90 C 20 68, 2 50, 2 28 C 2 12, 14 2, 27 2 C 37 2, 46 8, 50 17 C 54 8, 63 2, 73 2 C 86 2, 98 12, 98 28 C 98 50, 80 68, 50 90 Z"/>
    </svg>
    <div class="text">
      <h1 class="names">Fiona and John</h1>
      <p class="soon">Coming soon</p>
    </div>
  </main>
</body>
</html>
